services:
  rmbridge:
    build: .
    restart: unless-stopped
    # Any uid works; it needs to write ./data and your NAS share.
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${PORT:-8484}:${PORT:-8484}"
    env_file: .env
    volumes:
      - ${NAS_SHARE:-./data/nas}:/nas
      - ./data:/data
