<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rmbridge</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f5f2; --panel: #fff; --line: #e3e1dc; --text: #1d1c1a; --muted: #77746d;
    --accent: #1d1c1a; --accent-text: #fff; --sel: #efede8; --ok: #2f7d4f; --err: #b3392f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --panel: #1c1c1a; --line: #2e2d2a; --text: #ecebe7; --muted: #95928a;
            --accent: #ecebe7; --accent-text: #141413; --sel: #262522; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 ui-sans-serif, system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; margin-right: 6px; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--err); }
  #status { color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  select, button { font: inherit; color: inherit; }
  select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 20px; height: calc(100vh - 53px - 40px); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .bar h2 { font-size: 13px; margin: 0 8px 0 0; }
  .crumbs { flex: 1; min-width: 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crumbs a { color: inherit; cursor: pointer; text-decoration: none; }
  .crumbs a:hover { color: var(--text); text-decoration: underline; }
  ul { list-style: none; margin: 0; padding: 4px 0; overflow: auto; flex: 1; }
  li { display: grid; grid-template-columns: 20px 18px 1fr auto; align-items: center; gap: 8px; padding: 5px 12px; cursor: default; }
  li:hover { background: var(--sel); }
  li.folder .name { cursor: pointer; font-weight: 500; }
  li .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  li .ic { color: var(--muted); font-size: 12px; text-align: center; }
  .empty { color: var(--muted); padding: 20px 12px; }
  .drop { margin: 10px 12px 12px; border: 1.5px dashed var(--line); border-radius: 8px; padding: 14px; text-align: center; color: var(--muted); }
  .drop.over { border-color: var(--text); color: var(--text); }
  footer { height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-top: 1px solid var(--line); color: var(--muted); }
  #log { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #log.err { color: var(--err); } #log.ok { color: var(--ok); }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; height: auto; } section { height: 60vh; } }
</style>
</head>
<body>
<header>
  <h1>rmbridge</h1>
  <span id="status"><span class="dot"></span>checking…</span>
  <label>via <select id="backend"><option value="cloud">Cloud (rmapi)</option><option value="usb">USB cable</option></select></label>
</header>

<main>
  <section id="nas">
    <div class="bar">
      <h2>NAS</h2>
      <div class="crumbs" id="nas-crumbs"></div>
      <button class="primary" id="send" disabled>Send to reMarkable →</button>
    </div>
    <ul id="nas-list"></ul>
  </section>

  <section id="rm">
    <div class="bar">
      <h2>reMarkable</h2>
      <div class="crumbs" id="rm-crumbs"></div>
      <button class="primary" id="pull" disabled>← Save to NAS</button>
    </div>
    <ul id="rm-list"></ul>
    <label class="drop" id="drop">
      Drop PDFs / EPUBs here (or click) to upload into this folder
      <input type="file" id="file" multiple accept=".pdf,.epub" hidden>
    </label>
  </section>
</main>

<footer>
  <span id="log">Ready.</span>
  <span id="vault-info"></span>
  <button id="vault-sync" hidden>Sync Obsidian vault now</button>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const nasState = { path: "", selected: new Set() };
// Cloud refs are paths, USB refs are IDs; keep a breadcrumb trail of {ref, name}.
const rmState = { trail: [{ ref: "", name: "Home" }], selected: new Map() };

async function api(url, opts = {}) {
  const res = await fetch(url, opts);
  const body = res.headers.get("content-type")?.includes("json") ? await res.json() : await res.text();
  if (!res.ok) throw new Error(body.detail || body || res.statusText);
  return body;
}
const post = (url, data) => api(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(data) });

function log(msg, kind = "") { const el = $("log"); el.textContent = msg; el.className = kind; el.title = msg; }
function report(r, verb) {
  const msg = `${verb} ${r.done.length} file(s)` + (r.errors.length ? ` · ${r.errors.length} failed: ${r.errors.join("; ")}` : "");
  log(msg, r.errors.length ? "err" : "ok");
}
const fmtSize = (n) => n > 1e6 ? (n / 1e6).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1e3)) + " kB";
const fmtDate = (v) => { if (!v) return ""; const d = typeof v === "number" ? new Date(v * 1000) : new Date(v); return isNaN(d) ? "" : d.toLocaleDateString(); };

function row({ kind, name, meta, checked, onCheck, onOpen }) {
  const li = document.createElement("li");
  li.className = kind === "folder" ? "folder" : "file";
  const cb = document.createElement("input");
  cb.type = "checkbox"; cb.checked = checked; cb.onchange = () => onCheck(cb.checked);
  const ic = document.createElement("span"); ic.className = "ic"; ic.textContent = kind === "folder" ? "▸" : "▢";
  const nm = document.createElement("span"); nm.className = "name"; nm.textContent = name;
  if (onOpen) nm.onclick = onOpen;
  const mt = document.createElement("span"); mt.className = "meta"; mt.textContent = meta;
  li.append(cb, ic, nm, mt);
  return li;
}

function crumbs(el, parts, go) {
  el.replaceChildren();
  parts.forEach((p, i) => {
    if (i) el.append(" / ");
    const a = document.createElement("a"); a.textContent = p.name; a.onclick = () => go(i); el.append(a);
  });
}

async function loadNas(path = nasState.path) {
  nasState.path = path; nasState.selected.clear(); updateButtons();
  const segs = path ? path.split("/") : [];
  crumbs($("nas-crumbs"), [{ name: "NAS" }, ...segs.map((s) => ({ name: s }))],
    (i) => loadNas(segs.slice(0, i).join("/")));
  const list = $("nas-list");
  try {
    const items = await api(`/api/nas?path=${encodeURIComponent(path)}`);
    list.replaceChildren(...items.map((it) => row({
      kind: it.kind, name: it.name,
      meta: it.kind === "folder" ? "" : `${fmtSize(it.size)} · ${fmtDate(it.modified)}`,
      checked: false,
      onCheck: (on) => { on ? nasState.selected.add(it.path) : nasState.selected.delete(it.path); updateButtons(); },
      onOpen: it.kind === "folder" ? () => loadNas(it.path) : null,
    })));
    if (!items.length) list.innerHTML = `<div class="empty">No PDFs or EPUBs here.</div>`;
  } catch (e) { list.innerHTML = ""; log(e.message, "err"); }
}

const rmRef = () => rmState.trail.at(-1).ref;

async function loadRm() {
  rmState.selected.clear(); updateButtons();
  crumbs($("rm-crumbs"), rmState.trail, (i) => { rmState.trail = rmState.trail.slice(0, i + 1); loadRm(); });
  const list = $("rm-list");
  list.innerHTML = `<div class="empty">Loading…</div>`;
  try {
    const items = await api(`/api/rm?ref=${encodeURIComponent(rmRef())}`);
    list.replaceChildren(...items.map((it) => row({
      kind: it.kind, name: it.name,
      meta: [it.file_type, fmtDate(it.modified)].filter(Boolean).join(" · "),
      checked: false,
      onCheck: (on) => { on ? rmState.selected.set(it.ref, it.name) : rmState.selected.delete(it.ref); updateButtons(); },
      onOpen: it.kind === "folder" ? () => { rmState.trail.push({ ref: it.ref, name: it.name }); loadRm(); } : null,
    })));
    list.querySelectorAll("li.folder input").forEach((cb) => (cb.disabled = true));
    if (!items.length) list.innerHTML = `<div class="empty">Empty folder.</div>`;
  } catch (e) { list.innerHTML = `<div class="empty">${e.message.replace(/</g, "&lt;")}</div>`; }
}

function updateButtons() {
  $("send").disabled = !nasState.selected.size;
  $("pull").disabled = !rmState.selected.size;
}

async function busy(btn, label, fn) {
  const old = btn.textContent; btn.disabled = true; btn.textContent = label;
  try { await fn(); } catch (e) { log(e.message, "err"); } finally { btn.textContent = old; updateButtons(); }
}

$("send").onclick = () => busy($("send"), "Sending…", async () => {
  log(`Sending ${nasState.selected.size} item(s)…`);
  report(await post("/api/send", { paths: [...nasState.selected], folder: rmRef() }), "Sent");
  loadRm();
});

$("pull").onclick = () => busy($("pull"), "Saving…", async () => {
  log(`Downloading ${rmState.selected.size} document(s)…`);
  const items = [...rmState.selected].map(([ref, name]) => ({ ref, name }));
  report(await post("/api/pull", { items, nas_path: nasState.path }), "Saved");
  loadNas();
});

async function uploadFiles(files) {
  if (!files.length) return;
  const fd = new FormData();
  fd.append("folder", rmRef());
  for (const f of files) fd.append("files", f);
  log(`Uploading ${files.length} file(s)…`);
  try { report(await api("/api/upload", { method: "POST", body: fd }), "Uploaded"); loadRm(); }
  catch (e) { log(e.message, "err"); }
}
const drop = $("drop");
$("file").onchange = (e) => { uploadFiles([...e.target.files]); e.target.value = ""; };
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); uploadFiles([...e.dataTransfer.files]); };

$("backend").onchange = async (e) => {
  await post("/api/backend", { name: e.target.value });
  rmState.trail = [{ ref: "", name: "Home" }];
  refreshStatus(); loadRm();
};

$("vault-sync").onclick = () => busy($("vault-sync"), "Syncing…", async () => {
  const r = await post("/api/vault/sync", {});
  const msg = `Vault: pushed ${r.pushed.length}, pulled ${r.pulled.length}` + (r.errors.length ? ` · ${r.errors.join("; ")}` : "");
  log(msg, r.errors.length ? "err" : "ok");
  refreshStatus();
});

async function refreshStatus() {
  const s = await api("/api/status");
  $("backend").value = s.backend;
  const ok = s.remarkable.ok;
  $("status").innerHTML = `<span class="dot ${ok ? "ok" : "bad"}"></span>`;
  $("status").append(s.remarkable.detail);
  if (s.vault) {
    $("vault-sync").hidden = false;
    const last = s.vault.last?.finished ? new Date(s.vault.last.finished * 1000).toLocaleTimeString() : "never";
    $("vault-info").textContent = `Vault ↔ ${s.vault.rm_folder} · last sync ${last}`;
  }
}

refreshStatus().catch((e) => log(e.message, "err"));
loadNas(); loadRm();
</script>
</body>
</html>
